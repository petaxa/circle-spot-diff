name: Deploy Slidev to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect package manager
        id: package-manager
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
          elif [[ -f bun.lock || -f bun.lockb ]]; then
            echo "name=bun" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.package-manager.outputs.name != 'bun'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        if: steps.package-manager.outputs.name == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Enable Corepack
        if: steps.package-manager.outputs.name == 'yarn'
        run: corepack enable

      - name: Setup Bun
        if: steps.package-manager.outputs.name == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        run: |
          case "${{ steps.package-manager.outputs.name }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            npm)
              if [[ -f package-lock.json ]]; then
                npm ci
              else
                npm install
              fi
              ;;
          esac

      - name: Build Slidev
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ steps.package-manager.outputs.name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPOSITORY_NAME" == *.github.io ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/$REPOSITORY_NAME/"
          fi

          case "$PACKAGE_MANAGER" in
            pnpm) pnpm run build --base "$BASE_PATH" ;;
            yarn) yarn run build --base "$BASE_PATH" ;;
            bun) bun run build --base "$BASE_PATH" ;;
            npm) npm run build -- --base "$BASE_PATH" ;;
          esac

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
